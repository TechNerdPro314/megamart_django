services:
  db:
    image: postgres:16
    container_name: megamart_postgres
    restart: always
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: megamart_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/django.Dockerfile
    container_name: megamart_django
    command: >
      gunicorn config.wsgi:application 
      --bind 0.0.0.0:8000 
      --workers 2 
      --threads 2 
      --worker-class gthread 
      --max-requests 500 
      --max-requests-jitter 50 
      --timeout 120
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G          
          cpus: '1.0'
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env

  celery:
    build:
      context: ..
      dockerfile: docker/celery.Dockerfile
    container_name: megamart_celery
    command: celery -A config worker -l info
    restart: always
    volumes:
      - ..:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: