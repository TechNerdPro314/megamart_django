{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
          </div>
          <h2 class="fw-bold mb-3">Заказ №{{ order.id }} создан</h2>
          <p class="fs-5 mb-4">Сумма к оплате: <strong class="text-primary">{{ order.total_amount }} ₽</strong></p>
          <p class="text-muted mb-4">Статус заказа: ожидает оплаты</p>

          <div class="d-grid gap-2">
            <a href="{% url 'payments:pay_order' order.id %}" class="btn btn-primary btn-lg">
              <i class="bi bi-credit-card me-2"></i> Перейти к оплате
            </a>
            <a href="{% url 'orders:order_detail' order.id %}" class="btn btn-outline-secondary">
              Вернуться к заказу
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
