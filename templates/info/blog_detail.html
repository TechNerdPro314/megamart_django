{% extends 'base.html' %}
{% block title %}{{ post.title }} - Блог MegaMart{% endblock %}

{% block content %}
<div class="container py-5">
  <article>
    {% if post.image %}
      <img src="{{ post.image.url }}" class="rounded-3 mb-4 w-100" style="max-height: 400px; object-fit: cover;" alt="{{ post.title }}">
    {% endif %}

    <h1 class="fw-bold mb-3">{{ post.title }}</h1>
    <p class="text-muted mb-4">{{ post.published_at|date:"d.m.Y" }}</p>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        {{ post.content|safe }}
      </div>
    </div>

    <div class="mt-4">
      <a href="{% url 'info_blog' %}" class="btn btn-outline-primary">
        <i class="bi bi-arrow-left me-2"></i>Назад к блогу
      </a>
    </div>
  </article>
</div>
{% endblock %}
